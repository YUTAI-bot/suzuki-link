<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鈴木 悠太 | 整形外科医</title>
<meta name="description" content="整形外科医 鈴木悠太のご連絡先・関連リンク">
<meta name="robots" content="noindex">
<meta property="og:title" content="鈴木 悠太 | 整形外科医">
<meta property="og:description" content="ご連絡先・関連リンク">
<meta property="og:type" content="profile">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' fill='%231b3a2f'/><text x='16' y='23' font-size='20' text-anchor='middle' fill='%23f7f5f0' font-family='serif'>鈴</text></svg>">
<style>
  :root{
    --paper:#f7f5f0;      /* 生成り */
    --paper-2:#fffefb;
    --sumi:#1f1c1a;       /* 墨 */
    --sumi-soft:#5a534d;
    --midori:#1b3a2f;     /* 深緑 */
    --midori-2:#2f5a49;
    --line-c:#dcd6ca;
    --gold:#a08a55;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:"Yu Mincho","YuMincho","Hiragino Mincho ProN","Hiragino Mincho Pro","Noto Serif JP",serif;
    background:var(--paper);
    color:var(--sumi);
    line-height:1.8;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:clamp(28px,7vw,56px) 20px 40px;
    /* 和紙のような極薄テクスチャ */
    background-image:
      radial-gradient(circle at 20% 10%, rgba(160,138,85,.05), transparent 55%),
      radial-gradient(circle at 85% 80%, rgba(27,58,47,.045), transparent 50%);
  }
  .wrap{width:100%;max-width:420px}

  /* ── 名乗り ── */
  .head{text-align:center;padding-bottom:28px}
  .seal{
    width:54px;height:54px;margin:0 auto 20px;
    display:flex;align-items:center;justify-content:center;
    background:var(--midori);color:var(--paper-2);
    font-size:26px;line-height:1;letter-spacing:0;
    border-radius:2px;
    box-shadow:0 2px 10px rgba(31,28,26,.14);
  }
  .name{
    font-size:clamp(28px,8vw,34px);
    letter-spacing:.22em;
    text-indent:.22em;
    font-weight:500;
    line-height:1.4;
  }
  .name-en{
    margin-top:10px;
    font-family:"Optima","Palatino Linotype","Georgia",serif;
    font-size:11px;
    letter-spacing:.3em;
    text-indent:.3em;
    text-transform:uppercase;
    color:var(--sumi-soft);
  }
  .rule{
    width:44px;height:1px;margin:20px auto;
    background:var(--gold);opacity:.6;
  }
  .role{
    font-size:15px;
    letter-spacing:.14em;
    text-indent:.14em;
    color:var(--sumi);
  }
  .affil{
    margin-top:12px;
    font-size:13px;
    letter-spacing:.08em;
    color:var(--sumi-soft);
    line-height:2;
  }

  /* ── リンク ── */
  .links{display:flex;flex-direction:column;gap:12px;margin-top:8px}
  .btn{
    display:flex;align-items:center;gap:14px;
    padding:17px 20px;
    background:var(--paper-2);
    border:1px solid var(--line-c);
    border-radius:3px;
    text-decoration:none;
    color:var(--sumi);
    transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
    -webkit-tap-highlight-color:transparent;
  }
  .btn:hover,.btn:focus-visible{
    transform:translateY(-2px);
    box-shadow:0 6px 18px rgba(31,28,26,.09);
    border-color:var(--midori-2);
    outline:none;
  }
  .btn:active{transform:translateY(0)}
  .ico{
    flex:0 0 34px;height:34px;
    display:flex;align-items:center;justify-content:center;
    color:var(--midori);
  }
  .ico svg{width:21px;height:21px;display:block}
  .txt{flex:1;min-width:0}
  .txt b{
    display:block;
    font-size:15px;font-weight:500;
    letter-spacing:.08em;
    line-height:1.5;
  }
  .txt span{
    display:block;
    margin-top:3px;
    font-size:11px;
    letter-spacing:.06em;
    color:var(--sumi-soft);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .arw{flex:0 0 auto;color:var(--line-c);font-size:15px;line-height:1}
  .btn:hover .arw{color:var(--midori-2)}

  /* LINEだけ少し色を持たせる */
  .btn.line .ico{color:#06C755}

  .foot{
    margin-top:34px;
    text-align:center;
    font-size:10px;
    letter-spacing:.18em;
    color:var(--sumi-soft);
    opacity:.7;
  }

  @media (prefers-reduced-motion:reduce){
    .btn{transition:none}
    .btn:hover{transform:none}
  }
</style>
</head>
<body>
<main class="wrap">

  <header class="head">
    <div class="seal" aria-hidden="true">鈴</div>
    <h1 class="name">鈴木　悠太</h1>
    <p class="name-en">Yuta Suzuki</p>
    <div class="rule" aria-hidden="true"></div>
    <p class="role">整形外科医</p>
    <p class="affil">
      名古屋市立大学　整形外科<br>
      愛成会　すずき歯科医院
    </p>
  </header>

  <nav class="links" aria-label="連絡先とリンク">

          <path d="M3 21h18M5 21V8l7-5 7 5v13M9.5 21v-5h5v5"/>

    <!-- ▼▼ LINE友だち追加のURL：変更時はこの href="" の中だけ書き換える ▼▼ -->
    <a class="btn line" href="https://line.me/ti/p/xaEL_3vhmR" id="link-line" target="_blank" rel="noopener">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.3c0-4.2-4-7.6-9-7.6s-9 3.4-9 7.6c0 3.8 3.2 6.9 7.5 7.5.3.1.7.2.8.5.1.3.1.6 0 .9l-.1.8c0 .3-.2 1 .9.6 1.1-.5 6-3.5 8.2-6 1.1-1.2 1.7-2.6 1.7-4.3z"/>
        </svg>
      </span>
      <span class="txt">
        <b>LINE で友だち追加</b>
        <span>ご相談・ご連絡はこちらから</span>
      </span>
      <span class="arw" aria-hidden="true">›</span>
    </a>

    <a class="btn" href="tel:08016107648">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.8a16 16 0 0 0 6 6l1.2-1.2a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.8 2.1z"/>
        </svg>
      </span>
      <span class="txt">
        <b>電話をかける</b>
        <span>080-1610-7648</span>
      </span>
      <span class="arw" aria-hidden="true">›</span>
    </a>

    <a class="btn" href="mailto:ysuzuki.soc@gmail.com">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="2.5" y="4.5" width="19" height="15" rx="2"/>
          <path d="m3 6.5 9 6 9-6"/>
        </svg>
      </span>
      <span class="txt">
        <b>メールを送る</b>
        <span>ysuzuki.soc@gmail.com</span>
      </span>
      <span class="arw" aria-hidden="true">›</span>
    </a>

  </nav>

  <p class="foot">YUTA SUZUKI, M.D.</p>

</main>
</body>
</html>
